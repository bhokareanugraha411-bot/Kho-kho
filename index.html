 r.vx+=(dx/l*m-r.vx)*k;r.vz+=(dz/l*m-r.vz)*k;move(r,dt)}
function move(r,dt){const p=r.root.position;p.x+=r.vx*dt;p.z+=r.vz*dt;if(Math.abs(p.x)>HX){p.x=Math.sign(p.x)*HX;r.vx=0}if(Math.abs(p.z)>HZ){p.z=Math.sign(p.z)*HZ;r.vz=0}}
function runnerAI(r,dt){if(!r.alive)return;const p=r.root.position,c=G.ch.root.position;r.zt-=dt;if(r.zt<=0){r.zt=.35+Math.random()*.7;r.zz=Math.random()<.5?-1:1}
 let fx=p.x-(c.x+G.ch.vx*.5),fz=p.z-(c.z+G.ch.vz*.5);const d=Math.hypot(fx,fz)||1;fx/=d;fz/=d;const m=2.6;let wx=0,wz=0;
 if(p.x>HX-m)wx-=p.x-(HX-m);if(p.x<-HX+m)wx+=-HX+m-p.x;if(p.z>HZ-m)wz-=p.z-(HZ-m);if(p.z<-HZ+m)wz+=-HZ+m-p.z;
 const j=r.jit*(d<8?1:.3);let dx=fx+wx*.6-fz*r.zz*j,dz=fz+wz*.6+fx*r.zz*j;if(d>10){dx-=p.x*.05;dz-=p.z*.05}
 const l=Math.hypot(dx,dz)||1,m2=5.6*r.spd*(d<5?1.12:.85),k=Math.min(1,dt*6);r.vx+=(dx/l*m2-r.vx)*k;r.vz+=(dz/l*m2-r.vz)*k;move(r,dt)}
/* KhoSystem + chaser AI: legal-movement constrained (no reversal, no lane crossing, direction change only by pole or Kho) */
function chaserAI(dt){const c=G.ch,p=c.root.position,d=G.d,s=G.s,D=DIFF[S.diff],sp=5.4*D.sp,tg=nearest(p);if(!tg)return;
 const tp=tg.root.position,tx=tp.x+tg.vx*D.pred,tz=tp.z+tg.vz*D.pred,ahead=(tz-p.z)*d;let gx=tx,tk=-1;G.mode='CHASE';
 {let best=-1,bz=1e9;G.kc-=dt;sq.forEach((q,i)=>{if(q.f===-s){const dz=(q.z-p.z)*d;if(dz>-.3&&dz<bz&&dz>Math.abs(p.x-s*.7)*.8){bz=dz;best=i}}});
  if(ahead<-1.2){if(best>=0&&bz<PZ-p.z*d+2){tk=best;gx=s*.7;G.mode='SEEK KHO #'+(best+1)}else{gx=0;G.mode='TO POLE'}}
  else if(best>=0&&bz<5&&Math.hypot(tp.x-p.x,tp.z-p.z)>2.5&&G.kc<=0){tk=best;gx=s*.7;G.mode='GIVING KHO #'+(best+1)}}
 const vx=CL((gx-p.x)*4,-sp*.9,sp*.9),vz=d*Math.sqrt(Math.max(.2,sp*sp-vx*vx)),k=Math.min(1,dt*6);c.vx+=(vx-c.vx)*k;c.vz+=(vz-c.vz)*k;p.x+=c.vx*dt;p.z+=c.vz*dt;
 if(s*p.x<.25)p.x=s*.25;p.x=CL(p.x,-HX,HX);if(p.z*d>PZ+.9)p.z=d*(PZ+.9);
 if(tk>=0){const q=sq[tk];if(Math.abs(p.z-q.z)<.7&&Math.abs(p.x)<1.5&&(q.z-p.z)*d>-.7)return doKho(tk)}
 if(G.mode==='TO POLE'&&Math.abs(p.z-PZ*d)<.6&&Math.abs(p.x)<1){G.s=-s;G.d=-d;p.x=-s*.3;flash('POLE TURN','#8fd3ff')}}
function doKho(i){const q=sq[i],g=G.ch,n=q.occ;flash('KHO!','#ffb300');beep(500,.15,'square',.08,900);vib(60);
 g.sitT=1;g.root.position.set(0,0,q.z);g.yaw=q.f*Math.PI/2;g.vx=g.vz=0;q.occ=g;n.sitT=0;n.root.position.set(q.f*.5,0,q.z);n.vx=n.vz=0;
 const t=nearest(n.root.position);G.ch=n;G.s=q.f;G.d=t&&t.root.position.z<q.z?-1:1;G.khoT=.55;G.kc=1.3;setSt('KHO')}
function doOut(r){r.alive=false;r.outT=1;r.hide=1.6;G.ch.outs++;G.score++;flash('OUT!','#ff5252');beep(150,.4,'sawtooth',.1,60);vib(200);G.ch.vx=G.ch.vz=0;G.outT=1.1;setSt('OUT')}
function endMatch(){if(st==='END')return;setSt('END');const n=alive().length,win=n>0;win?ST.wins++:ST.losses++;ST.best=Math.max(ST.best,R[0].t);persist();whistle();
 let br=R[0];R.forEach(r=>{if(r.t>br.t)br=r});let bc=C[0];C.forEach(c=>{if(c.outs>bc.outs)bc=c});
 $('ew').textContent=win?'BTS KHO KHO TEAM WINS!':'COMPUTER XI WINS!';
 $('es').innerHTML='Final score: COMPUTER XI '+G.score+' outs | BTS runners not out: '+n+'<br>Players out: '+G.score+'<br>Best runner: '+br.name+' ('+br.t.toFixed(1)+'s)<br>Best chaser: '+(bc.outs?'PLAYER '+bc.num+' ('+bc.outs+' outs)':'none')+'<br>Match time: '+G.el.toFixed(1)+'s';show('end')}
function sim(dt){G.time-=dt;G.el+=dt;R.forEach(r=>{if(r.alive)r.t+=dt});playerStep(dt);R.forEach((r,i)=>i&&runnerAI(r,dt));chaserAI(dt);if(st!=='PLAYING')return;
 const c=G.ch.root.position;for(const r of R)if(r.alive&&Math.hypot(r.root.position.x-c.x,r.root.position.z-c.z)<.8){doOut(r);return}
 if(G.time<=0)endMatch()}
/* ---------- main loop / camera ---------- */
const CAMS=[[0,5.5,-8.5,0,1,4],[0,11,-9,0,0,4],[0,23,-17,0,0,3]],want=new THREE.Vector3(),look=new THREE.Vector3(0,1,0),lk=new THREE.Vector3();let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;fpsA+=(1/Math.max(dt,.001)-fpsA)*.05;
 if(st==='COUNTDOWN'){cdT-=dt;if(cdT<=0){cdI++;if(cdI>=CD.length){$('cd').innerHTML='';whistle();setSt('PLAYING')}else{$('cd').innerHTML=CD[cdI][0];cdT=CD[cdI][1];beep(cdI<5?440:880,.2)}}}
 else if(st==='PLAYING')sim(dt);
 else if(st==='KHO'){G.khoT-=dt;if(G.khoT<=0)setSt('PLAYING')}
 else if(st==='OUT'){G.outT-=dt;if(G.outT<=0){alive().length?setSt('PLAYING'):endMatch()}}
 const dd=st==='PAUSED'?0:dt;C.forEach(c=>c.update(dd,T));R.forEach(r=>r.update(dd,T));
 const ch=G.ch;if(ch){mkC.visible=mkP.visible=st!=='MENU'&&st!=='END';mkC.position.set(ch.root.position.x,2.5+Math.sin(T*5)*.1,ch.root.position.z);const pr=R[0];mkP.visible=mkP.visible&&pr.alive;mkP.position.set(pr.root.position.x,2.5+Math.sin(T*5)*.1,pr.root.position.z)}else mkC.visible=mkP.visible=false;
 if(st==='MENU'||st==='END'||!G.ch){cam.position.set(Math.sin(T*.15)*30,13,Math.cos(T*.15)*30);cam.lookAt(0,0,0)}
 else{const f=(R[0].alive?R[0]:alive()[0]||G.ch).root.position,o=CAMS[cm];want.set(CL(f.x+o[0],-16,16),o[1],Math.max(f.z+o[2],-26));cam.position.lerp(want,1-Math.exp(-5*dt));lk.set(f.x+o[3],o[4],f.z+o[5]);look.lerp(lk,1-Math.exp(-6*dt));cam.lookAt(look)}
 G.hudT=(G.hudT||0)-dt;if(G.hudT<=0&&G.ch&&st!=='MENU'){G.hudT=.2;const t=Math.max(0,G.time);$('hR').textContent=alive().length+' / 3';$('hT').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');$('hS').textContent=G.score;$('hC').textContent='PLAYER '+G.ch.num;$('hM').textContent=st==='PLAYING'?'TURN 1 - DEFEND':st;$('stf').style.width=(G.stam*100)+'%';
  if($('dbg').style.display==='block'){const p=R[0].root.position;$('dbg').textContent='FPS '+fpsA.toFixed(0)+'\nstate '+st+'\nplayer '+p.x.toFixed(1)+','+p.z.toFixed(1)+'\nAI '+G.mode+' dir '+G.d+' side '+G.s+'\nchaser P'+G.ch.num+'\nrunners '+alive().length+'\nbounds x±'+HX+' z±'+HZ}}
 renderer.render(scene,cam)}
applyG();setSt('MENU');requestAnimationFrame(loop);
})();
